<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inquiries Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
    <style>
      body { background: #f6f1ee; font-family: Arial, sans-serif; }
      .container { max-width: 1100px; margin: 50px auto; }
      .card { border: 1px solid rgba(122,79,88,0.2); border-radius: 16px; box-shadow: 0 12px 24px rgba(71,42,48,0.06); }
      .status { margin-top: 1rem; }
      table { margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card p-4">
        <h2>Inquiries Admin</h2>
        <p class="text-muted">View saved website inquiries from Supabase.</p>

        <div id="status" class="status alert alert-info">Loading inquiries…</div>

        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Interest</th>
                <th>Message</th>
                <th>Source</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody id="inquiries-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      window.SUPABASE_CONFIG = {
        url: 'https://vqmdguvminutfyvqzbpo.supabase.co',
          publishableKey: 'sb_publishable_YyYnp_JqOPgFWP4RAtlQQA_AFIrZI4C'
      };

      const statusEl = document.getElementById('status');
      const bodyEl = document.getElementById('inquiries-body');

      async function loadInquiries() {
        const config = window.SUPABASE_CONFIG || {};
        const hasSupabase = config.url && config.publishableKey;

        if (!hasSupabase) {
          statusEl.className = 'status alert alert-warning';
          statusEl.textContent = 'Supabase is not configured yet. Add the project URL and publishable key to this page to view inquiries.';
          return;
        }

        try {
          const response = await fetch(`${config.url}/rest/v1/inquiries?select=*`, {
            headers: {
              apikey: config.publishableKey
            }
          });

          if (!response.ok) {
            throw new Error('Unable to fetch inquiries');
          }

          const inquiries = await response.json();

          if (!inquiries.length) {
            statusEl.className = 'status alert alert-info';
            statusEl.textContent = 'No inquiries have been saved yet.';
            bodyEl.innerHTML = '';
            return;
          }

          statusEl.className = 'status alert alert-success';
          statusEl.textContent = `${inquiries.length} inquiry(s) loaded.`;

          bodyEl.innerHTML = inquiries.map(item => `
            <tr>
              <td>${(item.first_name || '') + ' ' + (item.last_name || '')}</td>
              <td>${item.email || ''}</td>
              <td>${item.interest || ''}</td>
              <td>${(item.message || '').replace(/\n/g, '<br>')}</td>
              <td>${item.source || ''}</td>
              <td>${item.created_at ? new Date(item.created_at).toLocaleString() : ''}</td>
            </tr>
          `).join('');
        } catch (error) {
          statusEl.className = 'status alert alert-danger';
          statusEl.textContent = 'Could not load inquiries. Check your Supabase URL and API key.';
          console.error(error);
        }
      }

      loadInquiries();
    </script>
  </body>
</html>
