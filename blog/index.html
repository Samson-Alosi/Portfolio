    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/style.css">
    <!-- Google Analytics: Global site tag -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0S1QR9VQ7S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0S1QR9VQ7S', { 'send_page_view': true });
    </script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container nav-inner">
          <a class="navbar-brand" href="/index.html#home">
            <span class="nav-brand-icon"><i class="fa-solid fa-brain" aria-hidden="true"></i></span>
            <span class="brand-copy">
              <span class="brand-mark">Samson Alosi Obongo</span>
              <small>Student - Clinical Psychology</small>
            </span>
          </a>
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ml-auto">
              <li class="nav-item"><a class="nav-link" href="/index.html#home"><i class="fa-solid fa-house" aria-hidden="true"></i> Home</a></li>
              <li class="nav-item"><a class="nav-link" href="/index.html#services"><i class="fa-solid fa-layer-group" aria-hidden="true"></i> Services</a></li>
              <li class="nav-item"><a class="nav-link" href="/index.html#about"><i class="fa-solid fa-user" aria-hidden="true"></i> About</a></li>
              <li class="nav-item"><a class="nav-link" href="/index.html#contact"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Contact</a></li>
              <li class="nav-item"><a class="nav-link active" href="/blog/" aria-current="page"><i class="fa-solid fa-newspaper" aria-hidden="true"></i> Blog</a></li>
            </ul>
            <a href="https://calendly.com/samsonalosi96/clinical-consultation" class="btn btn-primary nav-cta" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-calendar-check" aria-hidden="true"></i> Book a session</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="section">
      <div class="container">
        <div class="section-heading text-center">
          <p class="eyebrow">Insights & blog</p>
          <h2>Helpful resources for emotional wellbeing.</h2>
        </div>

        <div id="posts" class="row blog-grid">
            <!-- Posts will be rendered here -->
            <div class="col-12">
              <p>Loading posts…</p>
            </div>
          </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      // Load posts index generated at /posts/index.json
      const postsEl = document.getElementById('posts');
      fetch('/posts/index.json').then(r=>{
        if(!r.ok) throw new Error('posts index not found');
        return r.json();
      }).then(posts => {
        postsEl.innerHTML = '';
        posts.forEach(p => {
          const col = document.createElement('div');
          col.className = 'col-lg-4 col-md-6';
          col.innerHTML = `
            <article class="blog-card">
              <div class="blog-content">
                <span class="meta">${p.date || ''}</span>
                <h3>${p.title}</h3>
                <p>${p.excerpt || ''}</p>
                <a href="/blog/post.html?post=${p.slug}">Read article</a>
              </div>
            </article>
          `;
          postsEl.appendChild(col);
        });
      }).catch(err=>{
        postsEl.innerHTML = '<div class="col-12"><p>No posts found.</p></div>';
      });
    </script>
    <script src="/script.js"></script>
  </body>
</html>
