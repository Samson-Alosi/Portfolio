    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      function qs(name){
        const params = new URLSearchParams(location.search);
        return params.get(name);
      }

      const slug = qs('post');
      if(!slug){
        document.getElementById('post').innerHTML = '<p>No post specified.</p>';
      } else {
        const mdPath = `/posts/${slug}.md`;
        fetch(mdPath).then(r => {
          if(!r.ok) throw new Error('Post not found');
          return r.text();
        }).then(text => {
          // split frontmatter
          const match = text.match(/^-{3}[\s\S]*?-{3}/);
          let fm = {};
          let body = text;
          if(match){
            const raw = match[0].replace(/^-{3}/,'').replace(/-{3}$/,'');
            body = text.slice(match[0].length).trim();
            raw.split('\n').forEach(line => {
              const i = line.indexOf(':');
              if(i>0){
                const key = line.slice(0,i).trim();
                const val = line.slice(i+1).trim().replace(/^"|"$/g,'');
                fm[key]=val;
              }
            });
          }

          document.getElementById('post-title').textContent = fm.title || 'Untitled';
          document.getElementById('post-date').textContent = fm.date || '';
          document.getElementById('post-body').innerHTML = marked.parse(body);
        }).catch(err => {
          document.getElementById('post').innerHTML = '<p>Could not load post.</p>';
        });
      }
    </script>
