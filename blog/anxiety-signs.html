    <script>
      function qs(name){
        const params = new URLSearchParams(location.search);
        return params.get(name);
      }

      const slug = qs('post') || document.body.dataset.postSlug;
      const relatedPostsEl = document.getElementById('related-posts-list');
      if(!slug){
        document.getElementById('post').innerHTML = '<p>No post specified.</p>';
        relatedPostsEl.textContent = 'Open an article to see more posts.';
      } else {
        const mdPath = `../posts/${slug}.md`;
        fetch(mdPath).then(r => {
          if(!r.ok) throw new Error('Post not found');
          return r.text();
        }).then(text => {
          // split frontmatter
          const match = text.match(/^-{3}[\s\S]*?-{3}/);
          let fm = {};
          let body = text;
          if(match){
            const raw = match[0].replace(/^-{3}/,'').replace(/-{3}$/,'');
            body = text.slice(match[0].length).trim();
            raw.split('\n').forEach(line => {
              const i = line.indexOf(':');
              if(i>0){
                const key = line.slice(0,i).trim();
                const val = line.slice(i+1).trim().replace(/^"|"$/g,'');
                fm[key]=val;
              }
            });
          }

          document.getElementById('post-title').textContent = fm.title || 'Untitled';
          document.getElementById('post-date').textContent = fm.date || '';
          const canonicalUrl = document.querySelector('link[rel="canonical"]')?.href
            || new URL(`${encodeURIComponent(slug)}.html`, window.location.href).href;
          window.initializePostSharing(fm.title || 'Untitled', canonicalUrl);
          if (fm.image) {
            const imageFigure = document.getElementById('post-hero-image');
            const image = document.getElementById('post-hero-image-src');
            const caption = document.getElementById('post-hero-image-credit');
            image.src = fm.image;
            image.alt = fm.imageAlt || '';
            image.loading = 'eager';
            image.decoding = 'async';
            if (fm.imageCredit && fm.imageSource && fm.imageLicense && fm.imageLicenseUrl) {
              const sourceLink = document.createElement('a');
              sourceLink.href = fm.imageSource;
              sourceLink.target = '_blank';
              sourceLink.rel = 'noopener noreferrer';
              sourceLink.textContent = `Image: ${fm.imageCredit}`;
              const licenseLink = document.createElement('a');
              licenseLink.href = fm.imageLicenseUrl;
              licenseLink.target = '_blank';
              licenseLink.rel = 'noopener noreferrer';
              licenseLink.textContent = fm.imageLicense;
              caption.append(sourceLink, document.createTextNode(' · '), licenseLink);
            }
            imageFigure.hidden = false;
          }
          document.getElementById('post-body').innerHTML = marked.parse(body);
          window.BlogViews.increment(slug).then(count => {
            window.BlogViews.renderCount(document.getElementById('post-view-count'), count);
          }).catch(() => {});
        }).catch(err => {
          document.getElementById('post').innerHTML = '<p>Could not load post.</p>';
        });

        fetch('../posts/index.json').then(response => {
          if (!response.ok) throw new Error('Posts index not found');
          return response.json();
        }).then(posts => {
          const otherPosts = posts.filter(post => post.slug && post.slug !== slug);
          relatedPostsEl.replaceChildren();

          if (!otherPosts.length) {
            relatedPostsEl.textContent = 'No other articles yet.';
            return;
          }

          otherPosts.forEach(post => {
            const item = document.createElement('article');
            item.className = 'related-post-item';
            const link = document.createElement('a');
            link.className = 'related-post-link blog-title-link';
            link.href = `${encodeURIComponent(post.slug)}.html`;
            link.textContent = post.title || 'Untitled';
            const date = document.createElement('span');
            date.className = 'related-post-date';
            date.textContent = post.date || '';
            item.append(link, date);
            relatedPostsEl.appendChild(item);
          });
        }).catch(() => {
          relatedPostsEl.textContent = 'More articles are unavailable right now.';
        });
      }
    </script>
